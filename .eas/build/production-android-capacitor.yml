build:
  name: Infected Voices Core 5 Android
  steps:
    - eas/checkout
    - eas/install_node_modules
    - eas/resolve_build_config
    - eas/inject_android_credentials
    - eas/configure_android_version
    - run:
        name: Install Java 21 toolchain
        command: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-21-jdk
          java -version
          ls -la /usr/lib/jvm
    - run:
        name: Normalize Windows Gradle wrapper
        command: |
          sed -i 's/$//' android/gradlew
          chmod +x android/gradlew
          head -n 1 android/gradlew
    - eas/run_gradle
    - eas/find_and_upload_build_artifacts
