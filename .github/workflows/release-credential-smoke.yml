name: Release credential smoke

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/release-credential-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify publishing access
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --max-time 30 -o "$body" -w '%{http_code}' 'https://infected-voices-cm05um.v2.appdeploy.ai/api/_tmp-release-check-7b9d31')"
          echo "HTTP $status"
          if ! jq -e . "$body" >/dev/null 2>&1; then
            echo "VERIFIER_UNAVAILABLE"
            exit 20
          fi
          if [ "$(jq -r '.results.expo.ok' "$body")" != "true" ]; then
            echo "EXPO_FAILED"
            exit 11
          fi
          if [ "$(jq -r '.results.apple.ok' "$body")" != "true" ]; then
            echo "APPLE_FAILED"
            exit 12
          fi
          if [ "$(jq -r '.results.google.ok' "$body")" != "true" ]; then
            echo "GOOGLE_FAILED"
            exit 13
          fi
          echo "ALL_PASS"
