name: Release credential smoke

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/release-credential-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call sanitized Infected Voices verifier
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 30 'https://infected-voices-cm05um.v2.appdeploy.ai/api/_tmp-release-check-7b9d31')"
          echo "$response" | jq '{ok,missing,results:{expo:{ok,httpStatus,message},apple:{ok,httpStatus,message},google:{ok,httpStatus,message}}}'
          test "$(echo "$response" | jq -r '.results.expo.ok')" = "true"
          test "$(echo "$response" | jq -r '.results.apple.ok')" = "true"
          test "$(echo "$response" | jq -r '.results.google.ok')" = "true"
