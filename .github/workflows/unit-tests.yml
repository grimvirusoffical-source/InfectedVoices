name: Infected Voices Unit Tests

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Run Core unit tests
        run: npm test
      - name: Validate complete mobile payload
        run: npm run build:web
